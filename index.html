
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedal Patterns</title>
  <link rel="stylesheet" href="global.css" />
  <link rel="stylesheet" href="map.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
  />
  <script src="map.js" type="module"></script>
</head>
<body>
  <header>
    <div class="project-intro">
      <h1>🚴 Pedal Patterns</h1>
      <p>Explore bike lanes and Bluebikes station traffic across Boston and Cambridge, filtered by time of day.</p>
    </div>

    <div class="time-filter">
      <label for="time-slider">Filter by time:</label>

      <div class="slider-container">
        <input
          type="range"
          id="time-slider"
          min="-1"
          max="1439"
          step="1"
          value="-1"
        />

        <div class="time-display">
          <em id="any-time">(any time)</em>
          <time id="selected-time">11:59 PM</time>
        </div>
      </div>
    </div>
  </header>

  <div id="map">
    <svg></svg>
  </div>

  <div class="legend">
    <span class="legend-title">Traffic Flow:</span>
    <div class="legend-item" style="--departure-ratio: 1">
      <span class="legend-swatch"></span>
      <span>More departures</span>
    </div>
    <div class="legend-item" style="--departure-ratio: 0.5">
      <span class="legend-swatch"></span>
      <span>Balanced</span>
    </div>
    <div class="legend-item" style="--departure-ratio: 0">
      <span class="legend-swatch"></span>
      <span>More arrivals</span>
    </div>
  </div>
</body>
</html>
